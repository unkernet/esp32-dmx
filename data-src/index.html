<!DOCTYPE html>
<html>
<head>
    <title>ESP32 DMX Config</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        form { background: #f4f4f4; padding: 20px; border-radius: 8px; max-width: 600px; margin-top: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .section {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>ESP32 DMX Configuration</h1>

    <form id="configForm">
        <div class="section">
            <h2>Station (Client) Mode Settings</h2>
            <label for="sta_ssid">SSID:</label>
            <input type="text" id="sta_ssid" name="sta_ssid" maxlength="32"><br>

            <label for="sta_password">Password:</label>
            <input type="password" id="sta_password" name="sta_password" maxlength="64"><br>

            <label>
                <input type="checkbox" id="sta_dhcp_enabled" name="sta_dhcp_enabled">
                Enable DHCP
            </label><br><br>

            <label for="sta_ip_cidr">Static IP / CIDR:</label>
            <input type="text" id="sta_ip_cidr" name="sta_ip_cidr" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/(?:[0-9]|[1-2][0-9]|3[0-2])$"><br>

            <label for="sta_gateway">Gateway:</label>
            <input type="text" id="sta_gateway" name="sta_gateway" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"><br>
        </div>

        <div class="section">
            <h2>Access Point (AP) Mode Settings</h2>
            <label for="ap_ssid">SSID:</label>
            <input type="text" id="ap_ssid" name="ap_ssid" maxlength="32"><br>

            <label for="ap_password">Password:</label>
            <input type="password" id="ap_password" name="ap_password" maxlength="64"><br>

            <label for="ap_ip_cidr">IP Address / CIDR:</label>
            <input type="text" id="ap_ip_cidr" name="ap_ip_cidr" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\/(?:[0-9]|[1-2][0-9]|3[0-2])$"><br>

            <label for="ap_gateway">Gateway:</label>
            <input type="text" id="ap_gateway" name="ap_gateway" pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"><br>
        </div>

        <div class="section">
            <h2>Ambitful Settings</h2>
            <label for="ambitful_universe">Universe (0-255):</label>
            <input type="number" id="ambitful_universe" name="ambitful_universe" min="0" max="255" value="1"><br>

            <label for="ambitful_addr">Address (1-504):</label>
            <input type="number" id="ambitful_addr" name="ambitful_addr" min="1" max="504" value="1"><br>

            <label for="ambitful_channel">Ambitful channe (1-19)l:</label>
            <input type="number" id="ambitful_channel" name="ambitful_channel" min="1" max="19" value="1"><br>

            <label for="ambitful_groups">Ambitful groups (1-8):</label>
            <input type="number" id="ambitful_groups" name="ambitful_groups" min="1" max="8" value="4"><br>

            <label for="ble_interval">Advertising Interval (20-1000ms):</label>
            <input type="number" id="ble_interval" name="ble_interval" min="20" max="1000" value="20"><br>

            <label for="ble_duration_ms">Advertising Duration (50-10000ms):</label>
            <input type="number" id="ble_duration_ms" name="ble_duration_ms" min="50" max="10000ms" value="200"><br>
        </div>
        
        <input type="submit" value="Save Configuration">
    </form>

    <script src="index.js"></script>
</body>
</html>
